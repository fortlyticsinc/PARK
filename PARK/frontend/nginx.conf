# PARK — nginx config for the built SPA
# ============================================
# React Router does client-side routing, so a direct browser hit on
# e.g. /pairings has no matching file on disk — nginx must fall back
# to index.html for any path that isn't a real static asset, and let
# React Router take over from there. Without this, refreshing on any
# page but "/" gives a bare nginx 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text-based assets — meaningful savings on 2G/3G per this
    # project's own low-bandwidth design goals.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively — Vite fingerprints
    # filenames, so a new deploy naturally busts the cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
